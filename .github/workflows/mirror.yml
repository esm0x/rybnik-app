name: Mirror Rybnik data from miasto-engine

# Rybnik is scraped once, in esm0x/miasto-engine, with the same code as every other
# city. This repo no longer scrapes: it copies the finished files into scraper/data/,
# the paths that Mój Rybnik 1.3.x and older read, so installed apps keep working
# without an update. The scripts in scraper/ stay for reference and are not run.
#
# Hourly is cheap (a few small downloads) and keeps the lag behind the engine's
# six-hourly scrape under an hour. Nothing is committed when nothing changed.

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/mirror_engine_data.py'
      - '.github/workflows/mirror.yml'

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only. A file that does not parse or has lost its content is
      # not copied, so a bad engine run cannot blank the installed apps.
      - name: Copy from miasto-engine
        run: python scripts/mirror_engine_data.py

      # Runs even when one file was skipped, so the good ones still go out; the job
      # stays red from the step above.
      - name: Commit updated data (if changed)
        if: always()
        run: |
          git add scraper/data
          if git diff --cached --quiet -- scraper/data; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): mirror Rybnik data from miasto-engine"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
